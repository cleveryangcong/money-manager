<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Money</title>
<meta name="theme-color" content="#2f4b3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Money">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --hdr:#2f4b3f; --bg:#1b1d0e; --card:#2f302b; --card2:#373c36;
  --text:#ece9df; --muted:#aeab9f; --accent:#62c08f; --fab:#f2c14e;
  --neg:#e8573f; --pos:#62c08f; --line:#51544c; --field:#262820;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,Roboto,"Segoe UI",sans-serif}
body{min-height:100vh;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
input,select{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
#app{max-width:520px;margin:0 auto;padding-bottom:calc(120px + env(safe-area-inset-bottom))}

/* header */
.hdr{background:var(--hdr);border-radius:0 0 28px 28px;padding:calc(env(safe-area-inset-top) + 8px) 10px 0}
.hdr.overlap{padding-bottom:40px}
.hdr-row{display:flex;align-items:center;min-height:56px;gap:4px}
.ib{width:44px;height:44px;display:grid;place-items:center;flex:none;border-radius:50%}
.ib svg{width:26px;height:26px}
.ib:active{background:rgba(255,255,255,.08)}
.hdr-center{flex:1;text-align:center;min-width:0}
.hdr-title{font-size:20px;font-weight:500}
.hdr-sub{font-size:14px;color:var(--muted);margin-top:2px}
.hdr-amt{font-size:32px;font-weight:600;margin-top:2px;letter-spacing:.3px}
.hdr-left{flex:1;font-size:22px;font-weight:500;padding-left:12px}
.neg{color:var(--neg)} .pos{color:var(--pos)}
.tabs{display:flex}
.tabs button{flex:1;padding:12px 0 14px;font-size:17px;font-weight:600;letter-spacing:.5px;color:#a7b3a8;position:relative}
.tabs button.on{color:var(--text)}
.tabs button.on::after{content:"";position:absolute;left:23%;right:23%;bottom:6px;height:3px;background:var(--text);border-radius:2px}

/* period card */
.card{background:var(--card);border-radius:18px;margin:-40px 16px 0;position:relative;padding:6px 12px 14px}
.modes{display:flex;justify-content:space-around}
.modes button{padding:10px 4px 8px;color:var(--muted);font-size:17px}
.modes button.on{color:var(--accent);box-shadow:inset 0 -3px var(--accent)}
.pnav{display:flex;align-items:center;gap:4px;padding:8px 0 2px}
.pnav .plabel{flex:1;text-align:center;font-size:17px;text-decoration:underline;text-underline-offset:4px}
.pnav .ib svg{width:22px;height:22px}
.ib.ghost{visibility:hidden}
.totrow{display:flex;align-items:center;justify-content:space-between;padding:12px 6px 4px;font-size:18px;font-weight:600}
.chip{font-size:13px;font-weight:500;background:var(--card2);border-radius:14px;padding:5px 10px;display:inline-flex;gap:6px;align-items:center}

/* donut */
.donut{width:250px;margin:8px auto 4px;position:relative}
.donut-c{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:500}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:15px;line-height:1.5}

/* category rows */
.crow{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:14px;margin:10px 16px 0;padding:12px 14px;width:calc(100% - 32px);text-align:left}
.crow .nm{flex:1;font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .pc{width:52px;text-align:right;color:var(--muted);font-size:17px}
.crow .am{width:96px;text-align:right;font-size:18px}
.crow .bd{display:block;font-size:13px;color:var(--muted)}
.crow .bd.over{color:var(--neg)}
.crow.nag{background:rgba(242,193,78,.12);color:var(--fab)}
.crow.nag svg{width:24px;height:24px;flex:none}
.ci{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.ci svg{width:24px;height:24px}

/* transactions */
.dayh{padding:16px 10px 8px;color:var(--muted);font-size:16px}
.group{background:var(--card2);border-radius:14px;overflow:hidden}
.tx{display:flex;gap:12px;width:100%;padding:12px;text-align:left;align-items:center}
.tx + .tx{border-top:1px solid var(--line)}
.tx:active{background:rgba(255,255,255,.04)}
.tx .mid{flex:1;min-width:0}
.tx .cat{font-size:17px;font-weight:600}
.tx .note{font-size:15px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .amt{font-size:17px;font-weight:500;align-self:flex-start;padding-top:1px}

/* categories grid */
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 6px;padding:22px 12px}
.cgrid button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:15px;min-width:0}
.cgrid .ci{width:64px;height:64px}
.cgrid .ci svg{width:36px;height:36px}
.cgrid .lbl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cgrid .add .ci{background:var(--fab);color:#2b2b2b;width:52px;height:52px;margin:6px 0}
.cgrid.pick{padding:8px 0;gap:14px 4px}
.cgrid.pick .ci{width:52px;height:52px}
.cgrid.pick .ci svg{width:28px;height:28px}
.cgrid.pick button{font-size:13px;color:var(--muted)}
.cgrid.pick button.sel{color:var(--text)}
.cgrid.pick button.sel .ci{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--text)}
.cgrid.pick button:not(.sel) .ci{opacity:.55}

/* regular payments */
.sect{display:flex;align-items:center;gap:10px;padding:22px 22px 6px;color:var(--accent);font-size:19px}
.sect svg{width:28px;height:28px}
.rcard{display:block;width:calc(100% - 32px);margin:10px 16px 0;background:var(--card);border-radius:12px;padding:14px 16px;text-align:left}
.rtop{display:flex;align-items:flex-start;gap:10px}
.rtop .nm{flex:1;font-size:19px;min-width:0}
.ramt{font-size:19px;margin-top:6px}
.rdate{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:15px;margin-top:10px}
.rdate svg{width:22px;height:22px}
.rdate .fq{margin-left:auto;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:2px 8px}
.sw{width:48px;height:28px;border-radius:14px;background:#4a4d47;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:#c9cfc6;transition:left .18s}
.sw.on{background:#386d52}
.sw.on::after{left:24px;background:var(--accent)}

/* fab */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;background:var(--fab);color:#262626;box-shadow:0 6px 20px rgba(0,0,0,.5);display:grid;place-items:center;z-index:5}
.fab svg{width:30px;height:30px}

/* drawer */
.drawer{position:fixed;inset:0;z-index:30;visibility:hidden}
.drawer.open{visibility:visible}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .2s}
.drawer.open .scrim{opacity:1}
.panel{position:absolute;top:0;bottom:0;left:0;width:78%;max-width:300px;background:var(--card);padding:calc(env(safe-area-inset-top) + 18px) 0 0;transform:translateX(-100%);transition:transform .22s}
.drawer.open .panel{transform:none}
.panel .brand{padding:6px 22px 18px;font-size:22px;font-weight:600}
.panel button{display:flex;align-items:center;gap:16px;width:100%;padding:15px 22px;font-size:17px;text-align:left}
.panel button.on{color:var(--accent);background:rgba(98,192,143,.08)}
.panel svg{width:24px;height:24px}

/* sheet (forms) */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;-webkit-overflow-scrolling:touch;animation:up .2s ease-out}
.sheet[hidden]{display:none}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet-in{max-width:520px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}
.sh{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 0 10px;position:sticky;top:0;background:var(--bg);z-index:2}
.sh b{font-size:18px;font-weight:600}
.sh button{font-size:17px;color:var(--muted);padding:8px 4px;min-width:64px}
.sh button.save{color:var(--accent);font-weight:600;text-align:right}
.seg{display:flex;background:var(--card);border-radius:12px;padding:4px;margin:6px 0 14px}
.seg button{flex:1;padding:9px 0;border-radius:9px;font-size:16px;color:var(--muted)}
.seg button.on{background:var(--hdr);color:var(--text);font-weight:600}
.amt-in{width:100%;background:none;border:0;border-bottom:2px solid var(--line);color:var(--text);font-size:40px;font-weight:500;padding:6px 2px;outline:none;text-align:center;font-family:inherit}
.amt-in:focus{border-color:var(--accent)}
.lbl-s{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:20px 2px 8px}
.field{width:100%;background:var(--field);border:1px solid var(--line);border-radius:12px;color:var(--text);font-size:17px;padding:12px;outline:none;font-family:inherit;-webkit-appearance:none;appearance:none;min-height:48px}
.field:focus{border-color:var(--accent)}
.row2{display:flex;gap:10px}.row2>*{flex:1;min-width:0}
input[type=date].field,input[type=time].field{display:block}
.danger{width:100%;margin-top:28px;padding:14px;border-radius:12px;background:rgba(232,87,63,.12);color:var(--neg);font-size:17px}
.btn{width:100%;padding:14px;border-radius:12px;background:var(--card);font-size:17px;text-align:left;display:flex;align-items:center;gap:14px;margin-top:10px}
.btn svg{width:24px;height:24px;flex:none}
.btn small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.swatches{display:flex;flex-wrap:wrap;gap:12px}
.swatches button{width:38px;height:38px;border-radius:50%}
.swatches button.sel{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--text)}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.icons button{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--card)}
.icons button svg{width:26px;height:26px}
.icons button.sel{background:var(--hdr);box-shadow:0 0 0 2px var(--accent)}
.preview{display:flex;justify-content:center;margin:10px 0 4px}
.preview .ci{width:72px;height:72px}.preview .ci svg{width:40px;height:40px}
.swrow{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:12px;padding:12px 14px;margin-top:20px;font-size:17px}
.swrow small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.hint{color:var(--muted);font-size:14px;line-height:1.5;margin:8px 2px}

#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#ece9df;color:#1b1d0e;padding:10px 16px;border-radius:22px;font-size:15px;z-index:50;display:none;align-items:center;gap:14px;box-shadow:0 6px 20px rgba(0,0,0,.4);white-space:nowrap}
#toast.show{display:flex}
#toast button{font-weight:700;color:#2f6b4f}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" class="sheet" hidden></div>
<div id="drawer" class="drawer"><div class="scrim" data-a="drawer-close"></div><div class="panel" id="panel"></div></div>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

const COLORS = ['#e8b53e','#74ae52','#e14b43','#4472c4','#8a8a8a','#d3628f','#5db8a6','#9b84d6','#ec8a46','#5b93db','#e07b39','#3f9c6b'];

/* ---------- data ---------- */
const KEY = 'money-data-v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function defaults(){

function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) { const d = JSON.parse(raw); if (d && d.categories) return d; } } catch(e) {}
  return defaults();
}
let db = load();
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ toast('⚠️ Could not save – storage blocked'); }
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}

/* ---------- helpers ---------- */
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const short = d => `${MON[d.getMonth()].slice(0,3)} ${d.getDate()}`;
const longDate = d => `${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()} (${DOW[d.getDay()]})`;
const nowTime = () => { const n = new Date(); return `${pad(n.getHours())}:${pad(n.getMinutes())}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function money(c){
  const v = Math.abs(c)/100;
  return '€' + (c % 100 === 0
    ? v.toLocaleString('en-US',{maximumFractionDigits:0})
    : v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}));
}
function parseAmount(s){
  s = String(s).replace(/[€\s]/g,'');
  if (s.includes(',') && s.includes('.')) s = s.replace(/\./g,'').replace(',','.');
  else s = s.replace(',','.');
  const v = parseFloat(s);
  return isFinite(v) && v > 0 ? Math.round(v*100) : null;
}
const cat = id => db.categories.find(c => c.id === id) || {id, name:'Unknown', color:'#666', icon:'question'};
const catsOf = type => db.categories.filter(c => c.type === type && !c.archived);
const ciHtml = c => `<span class="ci" style="background:${c.color}">${ic(c.icon)}</span>`;

/* ---------- recurring ---------- */
function advance(r){
  const [d, t] = r.next.split('T');
  const dt = parseYmd(d);
  let n;
  if (r.freq === 'weekly') n = addDays(dt, 7);
  else if (r.freq === 'yearly') n = new Date(dt.getFullYear()+1, dt.getMonth(), Math.min(r.day||dt.getDate(), new Date(dt.getFullYear()+1, dt.getMonth()+1, 0).getDate()));
  else { const day = r.day || dt.getDate(); const last = new Date(dt.getFullYear(), dt.getMonth()+2, 0).getDate(); n = new Date(dt.getFullYear(), dt.getMonth()+1, Math.min(day, last)); }
  r.next = `${ymd(n)}T${t || '09:00'}`;
}
function processRecurring(){
  const now = new Date(); let added = 0;
  for (const r of db.recurring) {
    if (!r.active) continue;
    let guard = 0;
    while (new Date(r.next) <= now && guard++ < 200) {
      const [d,t] = r.next.split('T');
      db.transactions.push({id:uid(), type:r.type, amount:r.amount, categoryId:r.categoryId, date:d, time:t, note:r.name, recurringId:r.id});
      added++; advance(r);
    }
  }
  if (added) { save(); toast(`Added ${added} regular payment${added>1?'s':''}`); }
}

/* ---------- ui state ---------- */
const ui = { view:'stats', type:'expense', mode:'month', anchor:new Date(), from:null, to:null, catFilter:null, catType:'expense' };
function range(){
  const a = ui.anchor;
  switch (ui.mode) {
    case 'day': return [a, a];
    case 'week': { const s = addDays(a, -a.getDay()); return [s, addDays(s,6)]; }
    case 'year': return [new Date(a.getFullYear(),0,1), new Date(a.getFullYear(),11,31)];
    case 'period': return [ui.from, ui.to];
    default: return [new Date(a.getFullYear(),a.getMonth(),1), new Date(a.getFullYear(),a.getMonth()+1,0)];
  }
}
function rangeLabel(){
  const [f,t] = range();
  switch (ui.mode) {
    case 'day': return `${DOW[f.getDay()]}, ${short(f)}, ${f.getFullYear()}`;
    case 'week': return `${short(f)} – ${short(t)}`;
    case 'month': return `${MON[f.getMonth()]} ${f.getFullYear()}`;
    case 'year': return String(f.getFullYear());
    default: return `${short(f)} – ${short(t)}, ${t.getFullYear()}`;
  }
}
function shift(dir){
  const a = ui.anchor;
  ui.anchor = ui.mode==='day' ? addDays(a,dir) : ui.mode==='week' ? addDays(a,7*dir)
    : ui.mode==='year' ? new Date(a.getFullYear()+dir,0,1) : new Date(a.getFullYear(),a.getMonth()+dir,1);
}
function inRangeTx(type){
  const [f,t] = range(); const F = ymd(f), T = ymd(t);
  return db.transactions.filter(x => x.type===type && x.date>=F && x.date<=T);
}
const sum = arr => arr.reduce((s,x) => s + x.amount, 0);

/* ---------- views ---------- */
const tabs = (cur, act='type') => `<div class="tabs">
  <button data-a="${act}" data-v="expense" class="${cur==='expense'?'on':''}">EXPENSES</button>
  <button data-a="${act}" data-v="income" class="${cur==='income'?'on':''}">INCOME</button></div>`;

function periodBlock(){
  const [f,t] = range(), today = ymd(new Date());
  const isCurrent = ui.mode !== 'period' && ymd(f) <= today && ymd(t) >= today;
  const modes = [['day','Day'],['week','Week'],['month','Month'],['year','Year'],['period','Period']]
    .map(([k,l]) => `<button data-a="mode" data-v="${k}" class="${ui.mode===k?'on':''}">${l}</button>`).join('');
  const nav = ui.mode === 'period'
    ? `<div class="pnav"><span class="ib ghost"></span><button class="plabel" data-a="period-edit">${rangeLabel()}</button><span class="ib ghost"></span></div>`
    : `<div class="pnav"><button class="ib" data-a="prev">${ic('left',2)}</button>
        <button class="plabel" data-a="today">${rangeLabel()}</button>
        <button class="ib ${isCurrent?'ghost':''}" data-a="today" aria-label="Jump to today">${ic('today')}</button>
        <button class="ib" data-a="next">${ic('right',2)}</button></div>`;
  return `<div class="modes">${modes}</div>${nav}`;
}

function donut(rows, total){
  const R = 86, C = 2*Math.PI*R, SW = 30;
  let segs = '';
  if (total > 0) {
    let off = 0; const gap = rows.length > 1 ? 2.5 : 0;
    for (const r of rows) {
      const len = r.amount/total*C;
      segs += `<circle r="${R}" cx="125" cy="125" fill="none" stroke="${r.cat.color}" stroke-width="${SW}"
        stroke-dasharray="${Math.max(len-gap,0.01)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 125 125)"/>`;
      off += len;
    }
  } else segs = `<circle r="${R}" cx="125" cy="125" fill="none" stroke="#45473f" stroke-width="${SW}"/>`;
  return `<div class="donut"><svg viewBox="0 0 250 250">${segs}
    <circle r="${R-SW/2-8}" cx="125" cy="125" fill="none" stroke="#5a5c54" stroke-width="2.5" stroke-dasharray="7 5"/></svg>
    <div class="donut-c">${money(total)}</div></div>`;
}

function viewStats(){
  const txs = inRangeTx(ui.type), total = sum(txs);

  const rows = Object.entries(by).map(([id,amount]) => ({cat:cat(id), amount})).sort((a,b) => b.amount-a.amount);
  const sign = ui.type==='expense' ? '-' : '+';
  const list = rows.map(r => {

  }).join('');
  return `<header class="hdr overlap">

  </section>${backupNag()}${list}

}
function backupNag(){
  if (!db.transactions.length) return '';
  const days = db.lastBackup ? Math.floor((Date.now() - db.lastBackup) / 864e5) : null;
  if (days !== null && days < 14) return '';
  return `<button class="crow nag" data-a="export">${ic('download')}<span class="nm" style="font-size:15px;white-space:normal">${days===null?'No backup yet':`Last backup ${days} days ago`} – tap to save one</span></button>`;
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, undoFn){
  const el = document.getElementById('toast');
  el.innerHTML = esc(msg) + (undoFn ? ' <button id="undo">UNDO</button>' : '');
  el.classList.add('show');
  if (undoFn) document.getElementById('undo').onclick = () => { undoFn(); el.classList.remove('show'); };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), undoFn ? 5000 : 2500);
}

/* ---------- backup ---------- */
async function shareOrDownload(name, text, mime){
  const blob = new Blob([text], {type:mime});
  try {
    const file = new File([blob], name, {type:mime});
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:name}); return true; }
  } catch(e) { if (e && e.name === 'AbortError') return false; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  return true;
}
const stamp = () => ymd(new Date());
document.getElementById('importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (!d || !Array.isArray(d.categories) || !Array.isArray(d.transactions)) throw new Error('bad');
    d.recurring = d.recurring || [];
    try { localStorage.setItem(KEY+'-before-import', JSON.stringify(db)); } catch(_) {}
    db = d; save(); processRecurring(); render();
    toast(`Imported ${d.transactions.length} transactions`);
  } catch(err) { toast('That file is not a valid backup'); }
});

/* ---------- actions ---------- */
const A = {
  menu(){ document.getElementById('drawer').classList.add('open'); },
  'drawer-close'(){ document.getElementById('drawer').classList.remove('open'); },
  nav(_, v){ ui.view = v; ui.catFilter = null; A['drawer-close'](); window.scrollTo(0,0); },
  type(_, v){ ui.type = v; ui.catFilter = null; },
  'cat-type'(_, v){ ui.catType = v; },
  mode(_, v){
    if (v === 'period') { if (!ui.from) { const [f,t] = range(); ui.from = f; ui.to = t; } ui.mode = v; openPeriod(); return; }
    ui.mode = v;
  },
  prev(){ shift(-1); }, next(){ shift(1); }, today(){ ui.anchor = new Date(); },
  'period-edit'(){ openPeriod(); return 'keep'; },
  'save-period'(){
    const f = val('f-from'), t = val('f-to'); if (!f || !t) return toast('Pick both dates');
    ui.from = parseYmd(f <= t ? f : t); ui.to = parseYmd(f <= t ? t : f); closeSheet();
  },
  'go-tx'(){ ui.view = 'tx'; ui.catFilter = null; window.scrollTo(0,0); },
  'cat-row'(_, __, id){ ui.view = 'tx'; ui.catFilter = id; window.scrollTo(0,0); },
  back(){ ui.view = 'stats'; ui.catFilter = null; },
  'clear-filter'(){ ui.catFilter = null; },
  add(){ openTx(null); return 'keep'; },
  'edit-tx'(_, __, id){ openTx(id); return 'keep'; },
  close(){ closeSheet(); return 'keep'; },
  'f-type'(_, v){ readTx(); form.type = v; form.categoryId = (catsOf(v)[0]||{}).id; renderTx(); return 'keep'; },
  'f-cat'(_, __, id){ readTx(); form.categoryId = id; renderTx(); return 'keep'; },
  'save-tx'(){
    readTx(); const amount = parseAmount(form.amount);
    if (!amount) { toast('Enter an amount'); return 'keep'; }
    if (!form.categoryId) { toast('Pick a category'); return 'keep'; }
    const rec = {type:form.type, amount, categoryId:form.categoryId, date:form.date || ymd(new Date()), time:form.time || nowTime(), note:form.note.trim()};
    if (form.id) Object.assign(db.transactions.find(t => t.id===form.id), rec);
    else db.transactions.push({id:uid(), ...rec});
    save(); closeSheet();
  },
  'del-tx'(){
    const i = db.transactions.findIndex(t => t.id===form.id); if (i < 0) return;
    const [gone] = db.transactions.splice(i,1); save(); closeSheet(); render();
    toast('Deleted', () => { db.transactions.push(gone); save(); render(); }); return 'keep';
  },
  'cat-edit'(_, __, id){ openCat(id); return 'keep'; },
  'f-color'(_, v){ readCat(); form.color = v; renderCat(); return 'keep'; },
  'f-icon'(_, v){ readCat(); form.icon = v; renderCat(); return 'keep'; },
  'save-cat'(){
    readCat(); const name = form.name.trim(); if (!name) { toast('Enter a name'); return 'keep'; }
    const budget = form.budget ? parseAmount(form.budget) : null;
    const rec = {name, color:form.color, icon:form.icon, budget};
    if (form.id) Object.assign(db.categories.find(c => c.id===form.id), rec);
    else db.categories.push({id:uid(), type:form.type, ...rec});
    save(); closeSheet();
  },
  'del-cat'(){
    const c = db.categories.find(x => x.id===form.id); if (!c) return;
    const used = db.transactions.some(t => t.categoryId===c.id) || db.recurring.some(r => r.categoryId===c.id);
    if (used) c.archived = true; else db.categories = db.categories.filter(x => x !== c);
    save(); closeSheet(); render();
    toast(used ? 'Hidden (old entries keep it)' : 'Deleted', () => { if (used) delete c.archived; else db.categories.push(c); save(); render(); });
    return 'keep';
  },
  'rec-edit'(_, __, id){ openRec(id); return 'keep'; },
  'rec-toggle'(_, __, id){ const r = db.recurring.find(x => x.id===id); r.active = !r.active; save(); if (r.active) processRecurring(); },
  'f-rtype'(_, v){ readRec(); form.type = v; renderRec(); return 'keep'; },
  'f-active'(){ readRec(); form.active = !form.active; renderRec(); return 'keep'; },
  'save-rec'(){
    readRec(); const amount = parseAmount(form.amount), name = form.name.trim();
    if (!name) { toast('Enter a name'); return 'keep'; }
    if (!amount) { toast('Enter an amount'); return 'keep'; }
    if (!form.date) { toast('Pick a date'); return 'keep'; }
    const rec = {name, type:form.type, amount, categoryId:form.categoryId, freq:form.freq, next:`${form.date}T${form.time||'09:00'}`, day:parseYmd(form.date).getDate(), active:form.active};
    if (form.id) Object.assign(db.recurring.find(r => r.id===form.id), rec);
    else db.recurring.push({id:uid(), ...rec});
    save(); closeSheet(); processRecurring();
  },
  'del-rec'(){
    const i = db.recurring.findIndex(r => r.id===form.id); if (i < 0) return;
    const [gone] = db.recurring.splice(i,1); save(); closeSheet(); render();
    toast('Deleted', () => { db.recurring.push(gone); save(); render(); }); return 'keep';
  },
  async export(){
    const ok = await shareOrDownload(`money-backup-${stamp()}.json`, JSON.stringify(db, null, 1), 'application/json');
    if (ok) { db.lastBackup = Date.now(); save(); render(); toast('Backup saved'); }
    return 'keep';
  },
  import(){ document.getElementById('importFile').click(); return 'keep'; },
  csv(){
    const q = s => `"${String(s??'').replace(/"/g,'""')}"`;
    const rows = [['Date','Time','Type','Category','Amount','Note'].join(',')]
      .concat([...db.transactions].sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time))
      .map(x => [x.date, x.time, x.type, q(cat(x.categoryId).name), (x.amount/100).toFixed(2), q(x.note)].join(',')));
    shareOrDownload(`money-${stamp()}.csv`, rows.join('\n'), 'text/csv'); return 'keep';
  },
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const fn = A[t.dataset.a]; if (!fn) return;
  e.preventDefault(); e.stopPropagation();
  if (fn(t, t.dataset.v, t.dataset.id) !== 'keep') render();
});

/* ---------- boot ---------- */
processRecurring();
render();
document.addEventListener('visibilitychange', () => { if (!document.hidden) { processRecurring(); render(); } });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
